[Constants]
; Hand-authored fixture. Reproduces the shape of EDHM-UI's XML-Profile.ini,
; which carries Elite's 3x3 HUD colour matrix as nine float constants.
; The values here are invented for testing and are deliberately NOT any real
; theme's matrix -- they exist only to prove the parser reads rows and columns
; in the right order and does not silently transpose them.
;
; Row/column layout, per the real format's own comments:
;   x150 y150 z150  = MatrixRed    (top row)
;   x151 y151 z151  = MatrixGreen  (middle row)
;   x152 y152 z152  = MatrixBlue   (bottom row)
;
; Every value below is distinct so a transposition bug cannot pass by accident.

;===========================================
;       *** <MatrixRed> TOP Row ***
;-------------------------------------------
; Top Left
x150 = 0.11
;-------------------------------------------
; Top Centre
y150 = 0.22
;-------------------------------------------
; Top Right
z150 = 0.33
;===========================================
;   *** <MatrixGreen> MIDDLE Row ***
;-------------------------------------------
; Middle Left
x151 = 0.44
;-------------------------------------------
; Middle Centre
y151 = 0.55
;-------------------------------------------
; Middle Right
z151 = 0.66
;===========================================
;    *** <MatrixBlue> BOTTOM Row ***
;-------------------------------------------
; Bottom Left
x152 = 0.77
;-------------------------------------------
; Bottom Centre
y152 = 0.88
;-------------------------------------------
; Bottom Right
z152 = 0.99
