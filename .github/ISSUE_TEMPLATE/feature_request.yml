name: Feature idea
description: Suggest something LunaPanel doesn't do yet
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea for a button, a macro, or something LunaPanel should just
        do differently? This is the place. No idea is too small.

  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: What would you want to be able to do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What's it for?
      description: What's the situation in-game where you'd reach for this? Helps a lot in figuring out the right way to build it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I checked existing issues and didn't see this one already suggested.
          required: true
